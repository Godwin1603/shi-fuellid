# SHI Production Configuration File

# --- AI & Vision Settings ---
ai:
  # Path to the trained YOLO model
  model_path: "SHI_FURL-DOOR_YOLOv8-MODEL.pt"
  # Confidence threshold for detecting the OCR target regions (serial, back, etc.)
  ocr_confidence_threshold: 0.10
  # Fallback timeout (in seconds) before attempting to read the back panel if serial is missing
  ocr_fallback_timeout: 8.0
  # Per-class YOLO confidence thresholds. If a class is not listed, the default threshold below is used.
  class_confidences:
    front: 0.40
    back: 0.35
    serial: 0.10
    serial_area: 0.10
    line_mark: 0.30
    hole: 0.20
    hole_spec_error: 0.45    # Hole specification error defect
    back_hook: 0.20          # Back hook component (relaxed to ensure both hooks detected)
    back_hook_bend: 0.45     # Back hook bend defect
    lock_striker: 0.20       # Lock striker component (reliable capture)
    lock_striker_bend: 0.50  # Lock striker bend defect
    ring_bush: 0.20          # Ring bush component
    striker: 0.25            # Striker component (ensures both strikers detected)
    striker_bend: 0.45       # Striker bend defect
    buldge: 0.10             # Surface bulge defect
    dent: 0.10               # Surface dent defect
    defect: 0.10             # General defect
    frame_damage: 0.45       # Frame damage defect
    hand: 0.25               # Hand detection (avoids false hand alarms)
  # Minimum bounding box area (in pixels) for a defect to be considered valid to prevent false positives quickly
  min_defect_area: 50
  # Default YOLO confidence threshold if a class is not specified above
  default_yolo_confidence: 0.10
  
  # Stabilization delay (in seconds) to capture a clear, steady lock striker image
  lock_striker_delay: 0.4
  
  # Defect inspection & false-positive prevention settings
  check_missing_holes: false       # Flag NG if holes count not satisfied (disabled per user request)
  hide_holes_in_count_ui: true     # Hide Holes row from UI counts panel (set to false to show)
  check_missing_serial_ng: false   # If false: unread serial will not fail part as NG (only flags NG if physical defect)
  verify_stills_before_ng: true    # Cross-verify defects on captured high-resolution stills before logging NG

  # BC4I Fuel Door Distance Measurement (Catch Plug -> Trimline: 128.4 +/- 0.7 mm)
  distance_measurement:
    enabled: true
    flag_as_ng: true               # Strictly enforce client specification (+/- 0.7 mm)
    model: "BC4I"
    cfg_dir: "gauge_cfg"
    nominal_mm: 128.4
    tolerance_mm: 0.7              # Client drawing specification: 128.4 +/- 0.7 mm
    min_match_score: 0.50          # Template matching confidence floor
    vote_window: 10

  # Post-processing thresholds to filter out empty blue foam trays
  part_presence:
    blue_thresh: 0.75
    metal_min_ratio: 0.15
    laplacian_variance_min: 150.0  # Threshold for texture/edge density

  ring_bush_verification:
    enabled: false                 # Disabled: YOLO model is primary source of truth; OpenCV ROI rejection caused false NGs
    debug_mode: false
    lab_l_threshold: 200
    min_contour_area: 50
    max_contour_area: 5000
    morph_kernel_size: 5
    present_threshold: 0.7
    absent_threshold: 0.3
    weights:
      brightness: 0.3
      area: 0.3
      position: 0.2
      shape: 0.2

# --- Data Management ---
storage:
  # Number of days to keep old inspection reports and images before auto-deleting them
  retention_days: 30

# --- Web Server ---
web:
  host: "0.0.0.0"
  port: 5000

# --- UI Display Settings ---
ui:
  # Width of the side flash bars (OK / NG) as a percentage of the live camera view.
  # Reduce this value if the bars overlap the camera feed. Range: 1–50 (%)
  side_flash_width_percent: 50
  # Hard maximum width cap for the side flash bars in pixels.
  side_flash_max_width_px: 120

# --- Default Camera Connection Settings (Optional) ---
# If you want the app to auto-connect on startup, fill these out. Otherwise leave blank.
camera:
  # For GigE Cameras
  gige:
    target_serial: "73ABE004"  # Always connect this specific camera by serial number
    pixel_format: "BayerRG8" # UA5MEAGV-50C native color format (BGR8/RGB8 not supported by camera)
    exposure: 80000.0
    gain: 1.0
  # For RTSP IP Cameras
  rtsp:
    url: ""
